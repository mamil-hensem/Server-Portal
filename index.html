<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muzzammil Server Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 2rem;
      color: var(--accent-color);
      font-size: 2rem;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 1000px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--card-bg);
      color: var(--text-color);
      text-decoration: none;
      padding: 1.25rem 1rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .btn:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>

  <h1>Muzzammil Server Services</h1>

  <div class="grid">
    <a href="https://vaultwarden.muzzammilserver121.top" target="_blank" class="btn">Vaultwarden</a>
    <a href="https://proxy.muzzammilserver121.top" target="_blank" class="btn">Nginx Proxy Manager</a>
    <a href="https://nextcloud.muzzammilserver121.top" target="_blank" class="btn">Nextcloud</a>
    <a href="https://pi-hole.muzzammilserver121.top" target="_blank" class="btn">Pi-hole</a>
    <a href="https://dns.muzzammilserver121.top" target="_blank" class="btn">DNS Updater</a>
    <a href="https://immich.muzzammilserver121.top" target="_blank" class="btn">Immich</a>
    <a href="https://uptime-kuma.muzzammilserver121.top" target="_blank" class="btn">Uptime Kuma</a>
    <a href="https://homarr.muzzammilserver121.top" target="_blank" class="btn">Homarr</a>
    <a href="https://glances.muzzammilserver121.top" target="_blank" class="btn">Glances</a>
    <a href="https://beszel.muzzammilserver121.top" target="_blank" class="btn">Beszel</a>
  </div>

</body>
</html>
