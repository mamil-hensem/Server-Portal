<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAMIL</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --footer-text: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      margin-bottom: 2.5rem;
      color: var(--accent-color);
      font-size: 2.5rem;
      text-align: center;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* Fixed 4-column layout */
      gap: 1.25rem;
      width: 100%;
      max-width: 900px;
      flex-grow: 1;
    }
    /* Responsive adjustment for small screen devices */
    @media (max-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--card-bg);
      color: var(--text-color);
      text-decoration: none;
      padding: 1.5rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .btn:hover {
      background-color: var(--card-hover);
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      color: var(--accent-color);
    }
    .icon {
      width: 40px;
      height: 40px;
      margin-bottom: 0.75rem;
    }
    .icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .btn-title {
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }

    /* Footer Styling */
    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      width: 100%;
      max-width: 500px;
      color: var(--footer-text);
    }
    .contact-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--footer-text);
    }
    .contact-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .contact-link {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    .contact-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
    .contact-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
